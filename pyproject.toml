[project]
name = "investment-tracker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ipykernel>=7.3.0",
    "pandas>=3.0.5",
    "plotly>=7.1.0",
    "psycopg>=3.3.6",
    "psycopg-binary>=3.3.6",
    "psycopg2-binary>=2.9.13",
    "pyxirr>=0.10.8",
    "sqlalchemy>=2.1.2",
    "streamlit>=1.64.0",
    "yfinance>=1.6.0",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = ["src"]
